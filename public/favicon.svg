<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base (App Icon Shape) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="115" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>

  <!-- Radial Glow Behind Emblem -->
  <circle cx="256" cy="240" r="140" fill="#1877F2" opacity="0.22" filter="url(#glow)"/>

  <!-- Main Emblem Group with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Isometric Foundation / Site Platform -->
    <polygon points="256,395 385,320 256,245 127,320" fill="#111C33" stroke="#1E293B" stroke-width="2"/>
    <polygon points="256,395 385,320 385,338 256,413" fill="#0B1326"/>
    <polygon points="256,395 127,320 127,338 256,413" fill="#070D1A"/>

    <!-- Left Building Facade (Structural Walls) -->
    <polygon points="256,120 160,175 160,295 256,240" fill="url(#blueGrad)" opacity="0.95"/>
    
    <!-- Right Building Facade (Glass / Lighted Wall) -->
    <polygon points="256,120 352,175 352,295 256,240" fill="url(#cyanGrad)" opacity="0.88"/>

    <!-- Architectural Window Lines & Divisions (Finishing Precision Grid) -->
    <line x1="208" y1="147" x2="208" y2="267" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
    <line x1="160" y1="235" x2="256" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    
    <line x1="304" y1="147" x2="304" y2="267" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
    <line x1="256" y1="180" x2="352" y2="235" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>

    <!-- Golden Architectural Finishing Contour (Accentuating the Building) -->
    <polygon points="127,315 256,240 256,252 127,327" fill="url(#goldGrad)" filter="url(#glow)"/>
    <polygon points="256,240 385,315 385,327 256,252" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Golden Finishing Trowel (Symbol of Craftsmanship & Finishing Perfection) -->
    <g transform="translate(320, 235) rotate(15)">
      <!-- Blade -->
      <polygon points="0,-45 42,35 -42,35" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Neck -->
      <path d="M0,35 L0,55" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
      <!-- Handle -->
      <rect x="-7" y="55" width="14" height="34" rx="4" fill="#92400E" stroke="#FDE047" stroke-width="1.5"/>
    </g>

    <!-- Top Sparkle / Quality Pinnacle Star -->
    <path d="M256,58 L261,72 L275,77 L261,82 L256,96 L251,82 L237,77 L251,72 Z" fill="#FDE047" filter="url(#glow)"/>
  </g>
</svg>